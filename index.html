<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7fbf5" />
  <meta name="description" content="사진과 정보를 입력해 반려동물 프로필 카드를 PNG로 저장하세요." />
  <title>반려동물 카드 만들기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum:wght@400;700&family=Jua&display=swap" rel="stylesheet" />
  <link rel="preload" href="gangwon-ttonton.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="changwon-asac.ttf" as="font" type="font/ttf" crossorigin />
  <style>
    @font-face { font-family:'GangwonTteunTteun'; src:url('gangwon-ttonton.ttf') format('truetype'); font-weight:800; font-style:normal; font-display:block; }
    @font-face { font-family:'ChangwonAsac'; src:url('changwon-asac.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:block; }
    :root { --ink:#123c1b; --green:#66c65a; --mint:#eaf9e4; --line:#d8ead3; --panel:#fff; --bg:#f3f7f1; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:radial-gradient(circle at 10% 5%,#e7f8df 0,transparent 28rem),var(--bg); color:var(--ink); font-family:"Gowun Dodum",sans-serif; }
    button,input { font:inherit; }
    .workspace { min-height:100vh; display:grid; grid-template-columns:minmax(360px,460px) minmax(460px,554px); justify-content:space-between; gap:clamp(42px,7vw,110px); align-items:center; max-width:1440px; margin:auto; padding:clamp(22px,4vw,52px); }
    .editor { padding:clamp(24px,4vw,38px); border:1px solid rgba(255,255,255,.92); border-radius:30px; background:rgba(255,255,255,.9); box-shadow:0 24px 65px rgba(35,83,39,.12); backdrop-filter:blur(14px); }
    .eyebrow { margin:0 0 8px; color:var(--green); font-size:.8rem; font-weight:700; letter-spacing:.14em; }
    h1 { margin:0; font-family:"ChangwonAsac","Jua",sans-serif; font-size:clamp(2rem,4vw,2.8rem); font-weight:400; }
    .intro { margin:8px 0 26px; color:#637b65; }
    .themes { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:0 0 20px; }
    .theme-btn { min-height:auto; padding:8px 5px; border:2px solid transparent; border-radius:13px; background:#f7f9f6; color:#40513f; font-size:.78rem; cursor:pointer; }
    .theme-btn.active { border-color:var(--green); box-shadow:0 0 0 2px #fff inset; }
    .swatch { width:27px; height:27px; border-radius:50%; margin:0 auto 5px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); }
    .photo-controls { grid-column:1/-1; display:grid; grid-template-columns:1fr auto; gap:8px 10px; align-items:center; margin-top:4px; }
    .photo-controls input[type="range"] { width:100%; accent-color:var(--green); }
    .photo-controls small { min-width:46px; text-align:right; color:#667968; }
    .photo-reset { grid-column:1/-1; min-height:38px; border-radius:11px; background:#e7f0e4; color:var(--ink); font-size:.83rem; }
    .photo-row { display:grid; grid-template-columns:auto 1fr; gap:9px 12px; align-items:center; padding:15px; margin-bottom:20px; border:1px dashed #b6d9ae; border-radius:17px; background:#f1faed; }
    .photo-row > strong { grid-column:1/-1; font-size:.9rem; }
    #photo { position:absolute; opacity:0; pointer-events:none; }
    .file-button { padding:10px 14px; border-radius:12px; background:#245d2e; color:white; font-weight:700; text-align:center; cursor:pointer; }
    #photo-name { overflow:hidden; color:#667968; font-size:.84rem; text-overflow:ellipsis; white-space:nowrap; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:17px 13px; }
    .field { min-width:0; }
    .field.wide,fieldset { grid-column:1/-1; }
    label,legend { display:block; margin:0 0 7px; font-size:.9rem; font-weight:700; }
    input[type="text"],input[type="date"] { width:100%; min-height:48px; padding:0 13px; border:1px solid var(--line); border-radius:13px; outline:none; background:#fcfefb; color:var(--ink); }
    input:focus { border-color:var(--green); box-shadow:0 0 0 4px rgba(102,198,90,.16); }
    fieldset { margin:0; padding:0; border:0; }
    .segments { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .segments input { position:absolute; opacity:0; }
    .segments span { display:block; font-family:"ChangwonAsac",sans-serif; padding:11px; border:1px solid var(--line); border-radius:13px; text-align:center; cursor:pointer; }
    .segments input:checked + span { border-color:var(--green); background:#eef9ea; color:#225b29; font-weight:700; }
    .actions { display:grid; grid-template-columns:1fr 1.7fr; gap:10px; margin-top:25px; }
    button { min-height:51px; border:0; border-radius:15px; font-weight:700; cursor:pointer; }
    .reset { background:#e7f0e4; color:var(--ink); }
    .save { background:linear-gradient(135deg,#75ce60,#43a855); color:white; box-shadow:0 10px 22px rgba(67,154,74,.24); }
    .note { margin:11px 0 0; color:#708172; font-size:.78rem; text-align:center; }
    .preview { justify-self:end; width:min(100%,554px); }
    .preview-head { display:flex; justify-content:space-between; width:100%; margin:0 0 11px; font-size:.84rem; }
    .preview-head strong { font-size:1rem; }
    .preview-head span { color:#718073; }
    .canvas-wrap { width:100%; margin:0; overflow:hidden; border-radius:20px; background:white; box-shadow:0 30px 75px rgba(30,62,32,.2); }
    canvas { display:block; width:100%; height:auto; }
    #toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%,18px); padding:11px 17px; border-radius:999px; background:#173e1d; color:white; opacity:0; pointer-events:none; transition:.22s; }
    #toast.show { transform:translate(-50%,0); opacity:1; }
    @media (max-width:1050px) { .workspace{grid-template-columns:1fr;align-items:start}.preview{grid-row:1;justify-self:center;width:min(100%,500px)}.editor{grid-row:2} }
    @media (max-width:480px) { .workspace{padding:14px;gap:20px}.editor{padding:22px 18px;border-radius:23px}.grid{grid-template-columns:1fr}.field,fieldset,.field.wide{grid-column:1}.canvas-wrap{border-radius:16px} }
  </style>
</head>
<body>
  <main class="workspace">
    <section class="editor" aria-labelledby="title">
      <p class="eyebrow">PET CARD STUDIO</p>
      <h1 id="title">우리 아이 카드 만들기</h1>
      <p class="intro">사진과 정보를 입력하면 바로 반영돼요.</p>
      <div class="themes" aria-label="테마색">
        <button type="button" class="theme-btn active" data-theme="green"><span class="swatch" style="display:block;background:#60B058"></span>초록</button>
        <button type="button" class="theme-btn" data-theme="pink"><span class="swatch" style="display:block;background:#ef8fa8"></span>핑크</button>
        <button type="button" class="theme-btn" data-theme="blue"><span class="swatch" style="display:block;background:#75aee8"></span>파랑</button>
        <button type="button" class="theme-btn" data-theme="purple"><span class="swatch" style="display:block;background:#a58bd8"></span>보라</button>
        <button type="button" class="theme-btn" data-theme="yellow"><span class="swatch" style="display:block;background:#f0c64c"></span>노랑</button>
        <button type="button" class="theme-btn" data-theme="orange"><span class="swatch" style="display:block;background:#e9904f"></span>주황</button>
        <button type="button" class="theme-btn" data-theme="black"><span class="swatch" style="display:block;background:#444444"></span>검정</button>
      </div>
      <form id="form">
        <div class="photo-row">
          <strong>사진</strong>
          <label class="file-button" for="photo">사진 선택</label>
          <input id="photo" type="file" accept="image/*" />
          <span id="photo-name">카드 원본 예시</span>
          <div class="photo-controls">
            <input id="zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="사진 확대 축소" />
            <small id="zoom-value">100%</small>
            <button id="photo-reset" class="photo-reset" type="button">사진 위치 초기화</button>
          </div>
        </div>
        <div class="grid">
          <div class="field wide"><label for="name">이름</label><input id="name" type="text" value="바나" maxlength="10" /></div>
          <fieldset><legend>성별</legend><div class="segments">
            <label><input type="radio" name="gender" value="♀" checked /><span>여아 ♀</span></label>
            <label><input type="radio" name="gender" value="♂" /><span>남아 ♂</span></label>
            <label><input type="radio" name="gender" value="" /><span>공란</span></label>
          </div></fieldset>
          <div class="field wide"><label for="species">종류</label><input id="species" type="text" value="크레스티드 게코" maxlength="24" /></div>
          <div class="field"><label for="birthday">생일</label><input id="birthday" type="date" value="2024-08-23" /></div>
          <div class="field"><label for="adoption">입양일</label><input id="adoption" type="date" value="2025-08-23" /></div>
        </div>
        <div class="actions"><button class="reset" id="reset" type="button">처음으로</button><button class="save" id="save" type="button">PNG 저장</button></div>
        <p class="note">사진과 입력 내용은 기기 밖으로 전송되지 않아요.</p>
      </form>
    </section>
    <section class="preview" aria-labelledby="preview-title">
      <div class="preview-head"><strong id="preview-title">미리보기</strong><span>700 × 1049</span></div>
      <div class="canvas-wrap"><canvas id="card" width="700" height="1049" aria-label="반려동물 카드 미리보기"></canvas></div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>

    [sample,photoMask,nameLabel].forEach(image=>image.onload=draw);

    function date(value){if(!value)return'날짜 미정';const[y,m,d]=value.split('-');return`${y.slice(2)}.${m}.${d}`}
    function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
    function fit(text,max,size,weight=800,family='GangwonTteunTteun'){do{ctx.font=`${weight} ${size}px "${family}", sans-serif`;size-=2}while(ctx.measureText(text).width>max&&size>24)}
    function flowerPath(cx,cy){
      ctx.beginPath();
      const ring=155,petal=215;
      for(let i=0;i<8;i++){const a=-Math.PI/2+i*Math.PI/4,x=cx+Math.cos(a)*ring,y=cy+Math.sin(a)*ring;ctx.moveTo(x+petal,y);ctx.arc(x,y,petal,0,Math.PI*2)}
      ctx.moveTo(cx+255,cy);ctx.arc(cx,cy,255,0,Math.PI*2);
    }
    function cloudPath(cx,cy){
      ctx.beginPath();
      const pts=[[-285,0,125],[-205,-95,115],[-80,-125,125],[80,-125,125],[205,-95,115],[285,0,125],[205,95,115],[80,125,125],[-80,125,125],[-205,95,115]];
      pts.forEach(([x,y,r])=>{ctx.moveTo(cx+x+r,cy+y);ctx.arc(cx+x,cy+y,r,0,Math.PI*2)});
      ctx.moveTo(cx+260,cy);ctx.arc(cx,cy,260,0,Math.PI*2);
    }
    function cover(image,x,y,w,h,target=ctx,zoom=1,offsetX=0,offsetY=0){
      const scale=Math.max(w/image.width,h/image.height)*zoom;
      const drawW=image.width*scale,drawH=image.height*scale;
      target.drawImage(image,x+(w-drawW)/2+offsetX,y+(h-drawH)/2+offsetY,drawW,drawH);
    }
    function drawPhoto(){
      const width=913,height=913;
      if(!photoMask.complete||!photoMask.naturalWidth){ctx.save();flowerPath(554,541);ctx.clip();ctx.fillStyle=themes[currentTheme].soft;ctx.fillRect(97.5,84.5,width,height);ctx.restore();return}
      const layer=document.createElement('canvas'),mask=document.createElement('canvas');
      layer.width=mask.width=width;layer.height=mask.height=height;
      const layerCtx=layer.getContext('2d'),maskCtx=mask.getContext('2d',{willReadFrequently:true});
      if(customPhoto&&photo.complete&&photo.naturalWidth)cover(photo,0,0,width,height,layerCtx,photoZoom,photoOffsetX,photoOffsetY);
      else if(sample.complete&&sample.naturalWidth)layerCtx.drawImage(sample,75,92,400,377,0,0,width,height);
      else{layerCtx.fillStyle=themes[currentTheme].soft;layerCtx.fillRect(0,0,width,height)}
      maskCtx.imageSmoothingEnabled=true;maskCtx.imageSmoothingQuality='high';
      maskCtx.drawImage(photoMask,0,0,1024,1024,0,0,width,height);
      const pixels=maskCtx.getImageData(0,0,width,height);
      for(let i=0;i<pixels.data.length;i+=4){const light=(pixels.data[i]+pixels.data[i+1]+pixels.data[i+2])/3;pixels.data[i]=255;pixels.data[i+1]=255;pixels.data[i+2]=255;pixels.data[i+3]=Math.max(0,Math.min(255,255-light))}
      maskCtx.putImageData(pixels,0,0);layerCtx.globalCompositeOperation='destination-in';layerCtx.drawImage(mask,0,0);layerCtx.globalCompositeOperation='source-over';ctx.drawImage(layer,97.5,84.5);
    }
    function draw(){
      ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,700,1049);ctx.fillStyle='#fff';ctx.fillRect(0,0,700,1049);ctx.save();ctx.scale(700/1108,700/1108);
      drawPhoto();
      const t=themes[currentTheme];

      // 이름 배경: 업로드한 참고 PNG의 실루엣을 그대로 사용
      if(nameBgMask.complete && nameBgMask.naturalWidth){
        const bgLayer=document.createElement('canvas');
        bgLayer.width=nameBgMask.naturalWidth;
        bgLayer.height=nameBgMask.naturalHeight;
        const bgCtx=bgLayer.getContext('2d');
        bgCtx.drawImage(nameBgMask,0,0);
        bgCtx.globalCompositeOperation='source-in';
        bgCtx.fillStyle=t.soft;
        bgCtx.fillRect(0,0,bgLayer.width,bgLayer.height);
        bgCtx.globalCompositeOperation='source-over';

        const bgW=712, bgH=346;
        ctx.drawImage(bgLayer,554-bgW/2,1029-bgH/2,bgW,bgH);
      }else{
        ctx.save();
        ctx.translate(554,1029);
        ctx.scale(.9,.72);
        ctx.translate(-554,-1029);
        ctx.fillStyle=t.soft;
        cloudPath(554,1029);
        ctx.fill();
        ctx.restore();
      }

      const gender=(document.querySelector('input[name="gender"]:checked')||{value:''}).value;
      const nameText=`${el.name.value||'이름'}${gender}`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=t.text;
      fit(nameText,610,118,800,'GangwonTteunTteun');
      ctx.fillText(nameText,554,997);

      ctx.fillStyle=t.main;
      fit(el.species.value||'종류를 입력하세요',620,57,800,'GangwonTteunTteun');
      ctx.fillText(el.species.value||'종류를 입력하세요',554,1093);

      ctx.fillStyle=t.soft;
      roundRect(150,1266,808,210,58);ctx.fill();

      ctx.strokeStyle=t.deco;ctx.lineWidth=7;ctx.setLineDash([5,15]);
      ctx.beginPath();ctx.moveTo(554,1316);ctx.lineTo(554,1441);ctx.stroke();ctx.setLineDash([]);

      ctx.fillStyle=t.main;
      ctx.font='700 42px "GangwonTteunTteun", sans-serif';
      ctx.fillText('생일',350,1331);ctx.fillText('입양',758,1331);

      ctx.fillStyle=t.text;
      ctx.font='700 61px "GangwonTteunTteun", sans-serif';
      ctx.fillText(date(el.birthday.value),350,1406);ctx.fillText(date(el.adoption.value),758,1406);
      ctx.restore();
    }
    document.querySelectorAll('.theme-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        currentTheme=btn.dataset.theme;
        const t=themes[currentTheme];
        document.documentElement.style.setProperty('--green',t.main);
        document.documentElement.style.setProperty('--ink',t.text);
        document.documentElement.style.setProperty('--mint',t.soft);
        draw();
      });
    });

    document.querySelector('#form').addEventListener('input',draw);
    el.photo.addEventListener('change',event=>{const file=event.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return toast('이미지 파일을 선택해 주세요.');document.querySelector('#photo-name').textContent=file.name;const reader=new FileReader();reader.onload=e=>{customPhoto=true;photoZoom=1;photoOffsetX=0;photoOffsetY=0;zoomInput.value='1';zoomValue.textContent='100%';photo.onload=draw;photo.src=e.target.result};reader.readAsDataURL(file)});
    zoomInput.addEventListener('input',()=>{
      photoZoom=parseFloat(zoomInput.value);
      zoomValue.textContent=Math.round(photoZoom*100)+'%';
      draw();
    });

    document.querySelector('#photo-reset').addEventListener('click',()=>{
      photoZoom=1;photoOffsetX=0;photoOffsetY=0;
      zoomInput.value='1';zoomValue.textContent='100%';
      draw();
    });

    function pointerToDesign(e){
      const rect=canvas.getBoundingClientRect();
      const p=e.touches?e.touches[0]:e;
      const canvasX=(p.clientX-rect.left)*(canvas.width/rect.width);
      const canvasY=(p.clientY-rect.top)*(canvas.height/rect.height);
      const scale=700/1108;
      return {x:canvasX/scale,y:canvasY/scale};
    }
    function insidePhoto(p){
      const dx=p.x-554,dy=p.y-541;
      return dx*dx+dy*dy<=330*330;
    }
    function startDrag(e){
      if(!customPhoto)return;
      const p=pointerToDesign(e);
      if(!insidePhoto(p))return;
      dragging=true;lastPoint=p;canvas.style.cursor='grabbing';e.preventDefault();
    }
    function moveDrag(e){
      if(!dragging)return;
      const p=pointerToDesign(e);
      photoOffsetX+=p.x-lastPoint.x;photoOffsetY+=p.y-lastPoint.y;lastPoint=p;draw();e.preventDefault();
    }
    function endDrag(){dragging=false;lastPoint=null;canvas.style.cursor='grab';}
    canvas.style.cursor='grab';canvas.style.touchAction='none';
    canvas.addEventListener('mousedown',startDrag);
    window.addEventListener('mousemove',moveDrag);
    window.addEventListener('mouseup',endDrag);
    canvas.addEventListener('touchstart',startDrag,{passive:false});
    canvas.addEventListener('touchmove',moveDrag,{passive:false});
    window.addEventListener('touchend',endDrag);

    document.querySelector('#reset').addEventListener('click',()=>{Object.keys(el).forEach(key=>{if(defaults[key]!==undefined)el[key].value=defaults[key]});document.querySelector(`input[name="gender"][value="${defaults.gender}"]`).checked=true;el.photo.value='';customPhoto=false;photoZoom=1;photoOffsetX=0;photoOffsetY=0;zoomInput.value='1';zoomValue.textContent='100%';document.querySelector('#photo-name').textContent='카드 원본 예시';draw()});
    const cardFontsReady=Promise.all([
      new FontFace('GangwonTteunTteun','url("gangwon-ttonton.ttf")',{weight:'800',style:'normal'}).load(),
      new FontFace('ChangwonAsac','url("changwon-asac.ttf")',{weight:'700',style:'normal'}).load()
    ]).then(fonts=>{fonts.forEach(font=>document.fonts.add(font));return document.fonts.ready});
    document.querySelector('#save').addEventListener('click',async()=>{try{await cardFontsReady}catch{toast('폰트 파일을 확인해 주세요.');return}draw();const link=document.createElement('a'),safe=(el.name.value||'pet').replace(/[\\/:*?"<>|]/g,'-');link.download=`${safe}-profile-card.png`;link.href=canvas.toDataURL('image/png');link.click();toast('PNG를 저장했어요.')});
    function toast(message){const box=document.querySelector('#toast');box.textContent=message;box.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>box.classList.remove('show'),2100)}
    cardFontsReady.then(draw).catch(()=>{draw();toast('fonts 폴더의 폰트 파일을 확인해 주세요.')});
  </script>
