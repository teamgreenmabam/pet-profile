<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7fbf5" />
  <meta name="description" content="사진과 정보를 입력해 반려동물 프로필 카드를 PNG로 저장하세요." />
  <title>반려동물 카드 만들기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum:wght@400;700&family=Jua&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#123c1b; --green:#66c65a; --mint:#eaf9e4; --line:#d8ead3; --panel:#fff; --bg:#f3f7f1; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:radial-gradient(circle at 10% 5%,#e7f8df 0,transparent 28rem),var(--bg); color:var(--ink); font-family:"Gowun Dodum",sans-serif; }
    button,input { font:inherit; }
    .workspace { min-height:100vh; display:grid; grid-template-columns:minmax(360px,460px) minmax(460px,554px); justify-content:space-between; gap:clamp(42px,7vw,110px); align-items:center; max-width:1440px; margin:auto; padding:clamp(22px,4vw,52px); }
    .editor { padding:clamp(24px,4vw,38px); border:1px solid rgba(255,255,255,.92); border-radius:30px; background:rgba(255,255,255,.9); box-shadow:0 24px 65px rgba(35,83,39,.12); backdrop-filter:blur(14px); }
    .eyebrow { margin:0 0 8px; color:var(--green); font-size:.8rem; font-weight:700; letter-spacing:.14em; }
    h1 { margin:0; font-family:"Jua",sans-serif; font-size:clamp(2rem,4vw,2.8rem); font-weight:400; }
    .intro { margin:8px 0 26px; color:#637b65; }
    .photo-row { display:grid; grid-template-columns:auto 1fr; gap:9px 12px; align-items:center; padding:15px; margin-bottom:20px; border:1px dashed #b6d9ae; border-radius:17px; background:#f1faed; }
    .photo-row > strong { grid-column:1/-1; font-size:.9rem; }
    #photo { position:absolute; opacity:0; pointer-events:none; }
    .file-button { padding:10px 14px; border-radius:12px; background:#245d2e; color:white; font-weight:700; text-align:center; cursor:pointer; }
    #photo-name { overflow:hidden; color:#667968; font-size:.84rem; text-overflow:ellipsis; white-space:nowrap; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:17px 13px; }
    .field { min-width:0; }
    .field.wide,fieldset { grid-column:1/-1; }
    label,legend { display:block; margin:0 0 7px; font-size:.9rem; font-weight:700; }
    input[type="text"],input[type="date"] { width:100%; min-height:48px; padding:0 13px; border:1px solid var(--line); border-radius:13px; outline:none; background:#fcfefb; color:var(--ink); }
    input:focus { border-color:var(--green); box-shadow:0 0 0 4px rgba(102,198,90,.16); }
    fieldset { margin:0; padding:0; border:0; }
    .segments { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .segments input { position:absolute; opacity:0; }
    .segments span { display:block; padding:11px; border:1px solid var(--line); border-radius:13px; text-align:center; cursor:pointer; }
    .segments input:checked + span { border-color:var(--green); background:#eef9ea; color:#225b29; font-weight:700; }
    .actions { display:grid; grid-template-columns:1fr 1.7fr; gap:10px; margin-top:25px; }
    button { min-height:51px; border:0; border-radius:15px; font-weight:700; cursor:pointer; }
    .reset { background:#e7f0e4; color:var(--ink); }
    .save { background:linear-gradient(135deg,#75ce60,#43a855); color:white; box-shadow:0 10px 22px rgba(67,154,74,.24); }
    .note { margin:11px 0 0; color:#708172; font-size:.78rem; text-align:center; }
    .preview { justify-self:end; width:min(100%,554px); }
    .preview-head { display:flex; justify-content:space-between; width:100%; margin:0 0 11px; font-size:.84rem; }
    .preview-head strong { font-size:1rem; }
    .preview-head span { color:#718073; }
    .canvas-wrap { width:100%; margin:0; overflow:hidden; border-radius:20px; background:white; box-shadow:0 30px 75px rgba(30,62,32,.2); }
    canvas { display:block; width:100%; height:auto; }
    #toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%,18px); padding:11px 17px; border-radius:999px; background:#173e1d; color:white; opacity:0; pointer-events:none; transition:.22s; }
    #toast.show { transform:translate(-50%,0); opacity:1; }
    @media (max-width:1050px) { .workspace{grid-template-columns:1fr;align-items:start}.preview{grid-row:1;justify-self:center;width:min(100%,500px)}.editor{grid-row:2} }
    @media (max-width:480px) { .workspace{padding:14px;gap:20px}.editor{padding:22px 18px;border-radius:23px}.grid{grid-template-columns:1fr}.field,fieldset,.field.wide{grid-column:1}.canvas-wrap{border-radius:16px} }
  </style>
</head>
<body>
  <main class="workspace">
    <section class="editor" aria-labelledby="title">
      <p class="eyebrow">PET CARD STUDIO</p>
      <h1 id="title">우리 아이 카드 만들기</h1>
      <p class="intro">사진과 정보를 입력하면 바로 반영돼요.</p>
      <form id="form">
        <div class="photo-row">
          <strong>사진</strong>
          <label class="file-button" for="photo">사진 선택</label>
          <input id="photo" type="file" accept="image/*" />
          <span id="photo-name">카드 원본 예시</span>
        </div>
        <div class="grid">
          <div class="field wide"><label for="name">이름</label><input id="name" type="text" value="바나" maxlength="10" /></div>
          <fieldset><legend>성별</legend><div class="segments">
            <label><input type="radio" name="gender" value="♀" checked /><span>여아 ♀</span></label>
            <label><input type="radio" name="gender" value="♂" /><span>남아 ♂</span></label>
          </div></fieldset>
          <div class="field wide"><label for="species">종류</label><input id="species" type="text" value="크레스티드 게코" maxlength="24" /></div>
          <div class="field"><label for="birthday">생일</label><input id="birthday" type="date" value="2024-08-23" /></div>
          <div class="field"><label for="adoption">입양일</label><input id="adoption" type="date" value="2025-08-23" /></div>
        </div>
        <div class="actions"><button class="reset" id="reset" type="button">처음으로</button><button class="save" id="save" type="button">PNG 저장</button></div>
        <p class="note">사진과 입력 내용은 기기 밖으로 전송되지 않아요.</p>
      </form>
    </section>
    <section class="preview" aria-labelledby="preview-title">
      <div class="preview-head"><strong id="preview-title">미리보기</strong><span>1108 × 1660</span></div>
      <div class="canvas-wrap"><canvas id="card" width="1108" height="1660" aria-label="반려동물 카드 미리보기"></canvas></div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>

    function date(value){if(!value)return'날짜 미정';const[y,m,d]=value.split('-');return`${y.slice(2)}.${m}.${d}`}
    function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
    function fit(text,max,size,weight=400){do{ctx.font=`${weight} ${size}px Jua, sans-serif`;size-=2}while(ctx.measureText(text).width>max&&size>24)}
    function flowerPath(cx,cy){
      ctx.beginPath();
      const ring=155,petal=215;
      for(let i=0;i<8;i++){const a=-Math.PI/2+i*Math.PI/4,x=cx+Math.cos(a)*ring,y=cy+Math.sin(a)*ring;ctx.moveTo(x+petal,y);ctx.arc(x,y,petal,0,Math.PI*2)}
      ctx.moveTo(cx+255,cy);ctx.arc(cx,cy,255,0,Math.PI*2);
    }
    function cloudPath(cx,cy){
      ctx.beginPath();
      const pts=[[-285,0,125],[-205,-95,115],[-80,-125,125],[80,-125,125],[205,-95,115],[285,0,125],[205,95,115],[80,125,125],[-80,125,125],[-205,95,115]];
      pts.forEach(([x,y,r])=>{ctx.moveTo(cx+x+r,cy+y);ctx.arc(cx+x,cy+y,r,0,Math.PI*2)});
      ctx.moveTo(cx+260,cy);ctx.arc(cx,cy,260,0,Math.PI*2);
    }
    function cover(image,x,y,w,h,target=ctx){const scale=Math.max(w/image.width,h/image.height),sw=w/scale,sh=h/scale,sx=(image.width-sw)/2,sy=(image.height-sh)/2;target.drawImage(image,sx,sy,sw,sh,x,y,w,h)}
    function doodles(){
      ctx.strokeStyle='#82cf69';ctx.lineWidth=13;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(70,375);ctx.bezierCurveTo(33,274,79,165,208,109);ctx.stroke();
      ctx.beginPath();ctx.moveTo(75,270);ctx.bezierCurveTo(105,215,194,222,190,270);ctx.bezierCurveTo(155,306,90,298,75,270);ctx.stroke();
      ctx.beginPath();ctx.moveTo(1030,1310);ctx.lineTo(970,1395);ctx.lineTo(1050,1405);ctx.lineTo(978,1500);ctx.stroke();
      ctx.beginPath();ctx.moveTo(1008,1530);ctx.lineTo(930,1634);ctx.moveTo(1062,1544);ctx.lineTo(986,1648);ctx.stroke();
      ctx.fillStyle='#7dce65';ctx.save();ctx.translate(978,1252);ctx.rotate(-.45);ctx.beginPath();ctx.ellipse(-15,0,12,27,0,0,Math.PI*2);ctx.ellipse(17,-3,12,27,0,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    function drawPhoto(){
      ctx.save();ctx.translate(554,560);ctx.scale(1,.94);ctx.translate(-554,-560);flowerPath(554,560);ctx.clip();
      if(customPhoto&&photo.complete&&photo.naturalWidth)cover(photo,174,180,760,760);
      else if(sample.complete&&sample.naturalWidth)ctx.drawImage(sample,85,102,380,354,174,203,760,708);
      else{ctx.fillStyle='#e8f6e3';ctx.fillRect(174,203,760,708)}
      ctx.restore();
    }
    function draw(){
      ctx.clearRect(0,0,1108,1660);ctx.fillStyle='#fff';ctx.fillRect(0,0,1108,1660);
      if(background.complete&&background.naturalWidth)ctx.drawImage(background,0,0,1108,1660);
      doodles();drawPhoto();
      ctx.save();ctx.translate(554,1065);ctx.scale(.9,.72);ctx.translate(-554,-1065);ctx.fillStyle='#eaf9e4';cloudPath(554,1065);ctx.fill();ctx.restore();
      const gender=document.querySelector('input[name="gender"]:checked').value;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#123f1b';fit(`${el.name.value||'이름'}${gender}`,610,118,400);ctx.fillText(`${el.name.value||'이름'}${gender}`,554,1031);
      ctx.fillStyle='#52b553';fit(el.species.value||'종류를 입력하세요',620,57,400);ctx.fillText(el.species.value||'종류를 입력하세요',554,1127);
      ctx.fillStyle='#ebf9e7';roundRect(150,1300,808,210,58);ctx.fill();
      ctx.strokeStyle='#82d66c';ctx.lineWidth=7;ctx.setLineDash([5,15]);ctx.beginPath();ctx.moveTo(554,1350);ctx.lineTo(554,1475);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#55b552';ctx.font='400 42px Jua, sans-serif';ctx.fillText('생일',350,1365);ctx.fillText('입양',758,1365);
      ctx.fillStyle='#123f1b';ctx.font='400 61px Jua, sans-serif';ctx.fillText(date(el.birthday.value),350,1440);ctx.fillText(date(el.adoption.value),758,1440);
    }
    document.querySelector('#form').addEventListener('input',draw);
    el.photo.addEventListener('change',event=>{const file=event.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return toast('이미지 파일을 선택해 주세요.');document.querySelector('#photo-name').textContent=file.name;const reader=new FileReader();reader.onload=e=>{customPhoto=true;photo.onload=draw;photo.src=e.target.result};reader.readAsDataURL(file)});
    document.querySelector('#reset').addEventListener('click',()=>{Object.keys(el).forEach(key=>{if(defaults[key]!==undefined)el[key].value=defaults[key]});document.querySelector(`input[name="gender"][value="${defaults.gender}"]`).checked=true;el.photo.value='';customPhoto=false;document.querySelector('#photo-name').textContent='카드 원본 예시';draw()});
    document.querySelector('#save').addEventListener('click',()=>{draw();const link=document.createElement('a'),safe=(el.name.value||'pet').replace(/[\\/:*?"<>|]/g,'-');link.download=`${safe}-profile-card.png`;link.href=canvas.toDataURL('image/png');link.click();toast('PNG를 저장했어요.')});
    function toast(message){const box=document.querySelector('#toast');box.textContent=message;box.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>box.classList.remove('show'),2100)}
    document.fonts.ready.then(draw);
  </script>
</body>
</html>
